# ~~ Generated by cdk-express-pipeline. To modify, edit your pipeline and run `cdk synth`
name: CDK Express Pipeline Diff
on:
  pull_request:
    branches:
      - main
jobs:
  synth__wave1:
    name: Synth Wave 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: npm run cdk -- synth '**'
          cloud-assembly-directory: cdk.out-wave1
          working-directory: .

  synth__wave2:
    name: Synth Wave 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: npm run cdk -- synth '**'
          cloud-assembly-directory: cdk.out-wave2
          working-directory: .

  diff__wave1:
    name: Diff dev - wave1___${{ matrix.stage }}
    needs:
      - synth__wave1
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        stage:
          - Stage1
          - Stage2
          - Stage3
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-diff
        with:
          job-name: Diff dev - wave1___${{ matrix.stage }}
          stack-selector-patterns: Wave1_${{ matrix.stage }}_*
          cloud-assembly-directory: cdk.out-wave1
          command: npm run cdk -- diff Wave1_${{ matrix.stage }}_*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
          assume-region: us-east-1

  diff__wave2:
    name: Diff dev - wave2___${{ matrix.stage }}
    needs:
      - synth__wave2
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        stage:
          - Stage1
          - Stage2
          - Stage3
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-diff
        with:
          job-name: Diff dev - wave2___${{ matrix.stage }}
          stack-selector-patterns: Wave2_${{ matrix.stage }}_*
          cloud-assembly-directory: cdk.out-wave2
          command: npm run cdk -- diff Wave2_${{ matrix.stage }}_*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
          assume-region: us-east-1
  print_diff:
    name: Print Diff
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    needs:
      - diff__wave1
      - diff__wave2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update PR Description
#        uses: rehanvdm/cdk-express-pipeline-github-diff@hide-empty-resources
#        uses: rehanvdm/cdk-express-pipeline-github-diff@v0.1.4
        uses: rehanvdm/cdk-express-pipeline-github-diff@fix-cache
        with:
          mode: print
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cloud-assemblies: |
            - header: Wave 1
              directory: cdk.out-wave1
            - header: Wave 2
              directory: cdk.out-wave2
