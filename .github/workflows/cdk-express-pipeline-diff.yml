# ~~ Generated by cdk-express-pipeline. To modify, edit your pipeline and run `cdk synth`
name: CDK Express Pipeline Diff
on:
  pull_request:
    branches:
      - main
jobs:
  synth__dev:
    name: Synth dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: npm run cdk -- synth '**'
          cloud-assembly-directory: cdk.out
  diff__dev:
    name: ${{ matrix.job-name }}
    needs:
      - synth__dev
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        include:
          - job-name: Diff dev - wave1
            cloud-assembly-directory: cdk.out
            stack-selector-patterns: Wave1_*
            command: npm run cdk -- diff Wave1_*
            assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
            assume-region: us-east-1
          - job-name: Diff dev - wave2
            cloud-assembly-directory: cdk.out
            stack-selector-patterns: Wave2_*
            command: npm run cdk -- diff Wave2_*
            assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
            assume-region: us-east-1
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-diff
        with:
          job-name: ${{ matrix.job-name }}
          stack-selector-patterns: ${{ matrix.stack-selector-patterns }}
          cloud-assembly-directory: ${{ matrix.cloud-assembly-directory }}
          command: ${{ matrix.command }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          assume-role-arn: ${{ matrix.assume-role-arn }}
          assume-region: ${{ matrix.assume-region }}
  print_diff:
    name: Print Diff
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    needs:
      - diff__dev
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update PR Description
        uses: rehanvdm/cdk-express-pipeline-github-diff@v0.1.3
        with:
          mode: print
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cloud-assemblies: '[{"header":"CDK Diff - dev","directory":"cdk.out"}]'
